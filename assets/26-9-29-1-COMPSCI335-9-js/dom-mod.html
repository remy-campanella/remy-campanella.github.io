<!DOCTYPE html>
<html>
    <head>
        <script>
            const clickTitle = document.getElementById("click");
            clickTitle.addEventListener(
                "click",
                () => clickTitle.style.backgroundColor = "blue"
            );
        </script>
    </head>
    <body>
        <h1 id="click">Click me just once!</h1> 
    </body>
</html>
